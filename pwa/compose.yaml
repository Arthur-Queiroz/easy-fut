name: fut-app-pwa

# Um servico so, rodando exatamente a imagem que vai para a VPS. Antes o
# Compose montava o Caddyfile e os assets por fora, entao a imagem publicada
# nunca era exercitada aqui -- foi assim que uma imagem sem servidor passou
# pela CI e so quebrou no deploy.
services:
  web:
    build: .
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:8087:80"
    networks:
      - fut-app

networks:
  fut-app:
    external: true
    name: fut-app
