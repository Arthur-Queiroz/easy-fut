name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write  # job release (reusable workflow) publica imagem no GHCR

concurrency:
  group: fut-app-pwa-production
  cancel-in-progress: false

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    env:
      DOMAIN: ci.fut-app.invalid
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose build


  # Release via reusable workflow do vps-infra: build+push GHCR por digest +
  # deploy via chave confinada deploy-fut-app. Gateado por DEPLOY_ENABLED.
  release:
    needs: [frontend, compose]
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    uses: Arthur-Queiroz/vps-deploy/.github/workflows/app-deploy.yml@main
    with:
      app-id: fut-app
      service: web
      image-repo: fut-app-org/fut-app-pwa
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
