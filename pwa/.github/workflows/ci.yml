name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fut-app-pwa-production
  cancel-in-progress: false

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    env:
      DOMAIN: ci.fut-app.invalid
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose build

  deploy:
    needs: [frontend, compose]
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.KVM2_DEPLOY_SSH_PRIVATE_KEY }}
      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o "$RUNNER_TEMP/cloudflared"
          sudo install -m 0755 "$RUNNER_TEMP/cloudflared" /usr/local/bin/cloudflared
      - name: Configure SSH through Cloudflare Access
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config <<'EOF'
          Host kvm2
            HostName 187.127.34.186
            User root
            ProxyCommand cloudflared access ssh --hostname ssh.devarthur.com.br
            StrictHostKeyChecking accept-new
          EOF
      - name: Deploy PWA
        run: |
          ssh kvm2 '
            set -eu
            if [ ! -d /opt/fut-app-pwa/.git ]; then
              git clone git@github.com:fut-app-org/fut-app-pwa.git /opt/fut-app-pwa
            fi
            cd /opt/fut-app-pwa
            git fetch origin main
            git reset --hard origin/main
            docker network inspect fut-app >/dev/null 2>&1 || docker network create fut-app
            docker compose up -d --build --remove-orphans
            docker compose ps
            curl --fail --retry 5 --retry-connrefused -I http://127.0.0.1:8085/
          '
